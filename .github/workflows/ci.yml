name: CI

# Every job runs the recipes OFFLINE against the published @cendor/* npm packages. There are NO
# secrets configured in this repo — a recipe that needs a key to go green does not belong here.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-resolve within the caret ranges, to catch dependency drift (a new @cendor minor, a
  # new framework release) before users do. Nothing here is locked, so this is the drift alarm.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  recipes:
    # D4 — SHARDED BY CATEGORY, with a PER-RECIPE `npm install`. The per-recipe install is the
    # point: it is what proves a copy-pasteable package.json actually resolves on its own, which a
    # workspace install would hide. Sharding by category keeps wall-clock flat as the tree grows.
    #
    # Each shard LOOPS over its category directory rather than naming recipes, so a new recipe is
    # covered the moment it lands. A new *category* still needs a matrix row — which is exactly what
    # the `coverage` job below refuses to let you forget.
    #
    # Node 20 AND 22 are in the matrix on purpose: AsyncLocalStorage behaves differently on
    # legacy-ALS Node than on 24 (@cendor/core 0.13.0–0.15.0 shipped a real bug that was invisible
    # on 24), so a recipe green only on the newest Node proves nothing about the LTS.
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
        category: [quickstarts, sdk, agents, combos, libs, providers, governance, bridges,
                   frameworks, observability, testing]
    name: ${{ matrix.category }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: run every ${{ matrix.category }} recipe offline
        run: |
          shopt -s nullglob
          found=0
          for dir in recipes/${{ matrix.category }}/*/; do
            dir="${dir%/}"
            [ -f "$dir/package.json" ] || { echo "::error::$dir has no package.json"; exit 1; }
            found=$((found + 1))
            echo "::group::$dir"
            (cd "$dir" && npm install --no-audit --no-fund && node index.mjs)
            # A recipe MAY ship a `smoke.mjs` — a second entry point for something `index.mjs`
            # cannot cover on its own. The m365 one drives the two Activities the M365 Agents
            # Playground sends, because "does it run in the Playground?" used to be answerable
            # only by a human with a browser, and a broken run instruction sat in that README
            # unnoticed until 2026-08-01. Optional by design: no other recipe needs one yet.
            if [ -f "$dir/smoke.mjs" ]; then
              echo "--- smoke.mjs ---"
              (cd "$dir" && node smoke.mjs)
            fi
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no recipes found under recipes/${{ matrix.category }} — the shard is empty"
            exit 1
          fi
          echo "$found recipe(s) ran offline in recipes/${{ matrix.category }}"
      # G1 — exactly one @cendor/core per recipe. A stale pin rots SILENTLY GREEN (the recipe still
      # runs; it just runs on an old shelf). Two cores = two event buses = a guardrail decision that
      # never reaches the SDK, with nothing failing to say so.
      - name: G1 — one @cendor/core per recipe
        run: |
          shopt -s nullglob
          dirs=(recipes/${{ matrix.category }}/*/)
          node scripts/check-one-core.mjs "${dirs[@]%/}"
      # G2 — the recipes ARE TypeScript. Every `index.mts` typechecks under `strict` against the
      # REAL published @cendor/* types (installed above, per recipe), and the committed `index.mjs`
      # beside it must be exactly what that source generates.
      #
      # This runs INSIDE the shard on purpose: typechecking needs each recipe's own node_modules,
      # which the step above already installed. Running it on both Node versions also proves the
      # generator is deterministic — same source, same bytes, either runtime.
      - name: G2 — typecheck .mts + .mjs is in sync
        run: |
          npm install --prefix scripts --no-audit --no-fund
          node scripts/check-ts-js-sync.mjs recipes/${{ matrix.category }}

  coverage:
    # A recipe CI never runs is a README promise nobody checks. This asserts every category
    # directory under recipes/ appears in the matrix above — the one thing the per-shard loop
    # cannot self-heal. (The Python cookbook once shipped four recipes whose "runs green offline"
    # claim CI had never executed; this is that lesson, as a gate.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node scripts/check-recipe-coverage.mjs --self-test
      - run: node scripts/check-recipe-coverage.mjs
      # A README is not executable, so no other gate can see a footer that promises a `RECORD=1`
      # live path the code never implements. Five brand-new recipes shipped exactly that on
      # 2026-08-01 with every other job green. Both directions are checked: a promised switch that
      # does not exist, AND an undocumented one that does.
      - run: node scripts/check-live-switches.mjs --self-test
      - run: node scripts/check-live-switches.mjs
      # The README's recipe TABLE is gated (by the site's card check, against both trees); the
      # SENTENCE stating the total was not, and on 2026-08-03 it was a number behind — 52 stated
      # against 53 on disk, with the table itself complete and correct. Prose rots silently because
      # no gate reads prose. The Python twin had the identical defect, one number further behind.
      - run: node scripts/check-readme-count.mjs
      # The sync gate's own negative control. It runs here rather than in a shard because it needs
      # no recipe deps — and because a gate whose self-test never runs is a gate nobody has checked.
      - name: install tooling
        run: npm install --prefix scripts --no-audit --no-fund
      - run: node scripts/check-ts-js-sync.mjs --self-test
